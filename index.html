<!DOCTYPE html>
<html lang = "en">
    <head>
        <link rel = "stylesheet" href = "styles.css">
    </head>
    <body>
        <h1>Reefscape Scouting</h1>
        <form id="mainForm">
            <fieldSet>
                <legend>Yes?</legend>

                <div>
                    <input type="checkbox" id="yes1" name="yes1">
                    <label for="yes1">yes.</label>
                </div>

                <div>
                    <input type="checkbox" id="yes2" name="yes2">
                    <label for="yes2">yes.</label>
                </div>
            </fieldSet>

            <fieldSet>
                <legend>What is the best color?</legend>

                <div>
                    <input type="radio" id="option1" name="options" value=".">
                    <label for="option1">Purple.</label>
                </div>

                <div>
                    <input type="radio" id="option2" name="options" value="?">
                    <label for="option2">Purple?</label>
                </div>

                <div>
                    <input type="radio" id="option3" name="options" value="!">
                    <label for="option3">Purple!</label>
                </div>

                <div>
                    <input type="radio" id="option4" name="options" value="banana">
                    <label for="option4">Monke say banana!!!!!!</label>
                </div>
            </fieldSet>


            <fieldset>
                <legend>What do you want to read about?</legend>

                <div>
                    <input type="radio" id="read1" name="readStuff" value="monke">
                    <label for="read1">Monke.</label>
                </div>

                <div>
                    <input type="radio" id="read2" name="readStuff" value="lorem">
                    <label for="read2">Filler.</label>
                </div>

                <div>
                    <input type="radio" id="read3" name="readStuff" value="romeo">
                    <label for="read3">Shakespeare.</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Add two numbers.</legend>

                <div id="addDiv">
                    <input type="number" id="add1" name="add1" step="any" placeholder="gimme a number">
                </div>
                <div id="addDiv">
                    <input type="number" id="add2" name="add2" step="any" placeholder="gimme another">
                </div>
            </fieldset>
            <button type="submit">Submit</button>
        </form>
        <pre id="log"></pre>
        <p id = "readP">Nothing here.</p>
        <p id = "addP">There really is nothing here.</p>
        <button id="something">Just a button.</button>
        <p id="somethingtext"></p>
        <p id="reward"></p>
        <script src="script.js"></script>
    </body>
</html>
