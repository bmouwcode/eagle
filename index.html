<!DOCTYPE html>
<html lang = "en">
    <head>
        <!--A link to the style file-->
        <link rel = "stylesheet" href = "styles.css">
        <!--import font for page headers-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Rubik+Marker+Hatch&display=swap" rel="stylesheet">
    </head>
    <body>
        <form id = "match">
            <!--Setup page, with some basic prematch details to fill in-->
            <div id = "setup">
                <h1><strong>PREMATCH</strong></h1>
                <!--Input for the name of the scouter-->
                <div class = "txtInput formItem">
                    <label for = "name">Scouter: </label>
                    <input type = "text" id = "name" name = "name">
                </div>
                <!--Input for the number of the current match-->
                <div class = "txtInput formItem">
                    <label for = "matchNumber">Match Number: </label>
                    <input type = "number" id = "matchNumber" name = "matchNumber">
                </div>
                <!--Input for where on the field the robot you are scouting is-->
                <div class="radioGrid formItem">
                    <label>
                        <input type = "radio" name = "loc" value = "r1">
                        Red 1
                    </label>
                    <label>
                        <input type = "radio" name = "loc" value = "b1">
                        Blue 1
                    </label>
                    <label>
                        <input type = "radio" name = "loc" value = "r2">
                        Red 2
                    </label>
                    <label>
                        <input type = "radio" name = "loc" value = "b2">
                        Blue 2
                    </label>
                    <label>
                        <input type = "radio" name = "loc" value = "r3">
                        Red 3
                    </label>
                    <label>
                        <input type = "radio" name = "loc" value = "b3">
                        Blue 3
                    </label>
                </div>
                <!--Input for the team number of the robot you are scouting-->
                <div class = "txtInput formItem">
                    <label for = "teamNumber">Team Number: </label>
                    <input type = "number" id = "teamNumber" name = "teamNumber">
                </div>
            </div>

            <!--Auto page, for any scoring done in the autonomous period-->
            <div id = "auto" hidden>
                <h1><strong>AUTONOMOUS</strong></h1>
                <!--Input for the amount of fuel scored in the hub during auto-->
                <div class = "incCounter formItem">
                    <span>Fuel Scored:</span>
                    <button type = "button" class = "small" id = "minusAuto">-</button>
                    <p id = "counterAuto">0</p>
                    <button type = "button" class = "small" id = "plusAuto">+</button>
                    <input type = "hidden" name = "fuelAuto" id = "fuelAutoInput" value = "0">
                </div>
                <div class = "checkbox formItem">
                    <label for = "climbAuto">Climbed?</label>
                    <input type = "checkbox" name = "climbAuto">
                </div>

            </div>

            <!--Teleop page, for main section of game-->
            <div id = "teleop" hidden>
                <h1><strong>TELEOPERATED</strong></h1>
            </div>

            <!--Endgame page, for end-of-match goals-->
            <div id = "endgame" hidden>
                <h1><strong>ENDGAME</strong></h1>
            </div>

            <!--Export page, for getting the data from this computer to the next-->
            <div id = "export" hidden>
                <h1><strong>EXPORT</strong></h1>
            </div>
            <div id = "floatright">
                <button type = "button">&gt;</button>
            </div>
            <div id = "floatleft">
                <button type = "button">&lt;</button>
            </div>
        </form>
        <!--All the scripts are in script.js, as seen-->
        <script src="script.js"></script>
    </body>
</html>
